name: Preview

on:
  push:
  pull_request:
  workflow_dispatch:

# GitHub Pages preview. No bucket keys.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from package JSON
        run: python3 build.py
      - name: Check preview guards
        run: python3 check_build.py
      - name: Stage public files only
        run: |
          mkdir -p public-site
          cp index.html robots.txt .nojekyll 404.html public-site/
          cp -a assets kaliningrad metodika public-site/
          if find public-site -name '*.json' | grep -q .; then
            echo "snapshot JSON must not be a site page"
            exit 1
          fi
          if find public-site -name '*ranking-table.md' | grep -q .; then
            echo "ranking markdown must not be a site page"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public-site
