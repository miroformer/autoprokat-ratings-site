name: Preview

on:
  push:
  pull_request:
  workflow_dispatch:

# GitHub Pages preview. No bucket keys.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from published snapshot
        run: python3 build.py
      - name: Check preview guards
        run: python3 check_build.py
      - uses: actions/configure-pages@v5
      - name: Check Jekyll Pages output has no snapshot JSON
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Assert Jekyll public tree
        run: |
          test ! -e _site/data
          test ! -e _site/docs
          test ! -e _site/media
          test ! -e _site/mockups
          test -f _site/404.html
          test -f _site/index.html
          test -f _site/assets/style.css
          test -f _site/assets/og-image.png
          test -f _site/assets/marks/shared.svg
          test -f _site/kaliningrad/zaprosy/index.html
          test -f _site/kaliningrad/index.html
          test -f _site/kontakty/index.html
          if find _site -name '*.json' | grep -q .; then
            echo "snapshot JSON must not be a site page"
            exit 1
          fi
          if grep -q toc-grid _site/404.html; then
            echo "404 must not be index.html fallback"
            exit 1
          fi
          python3 -c 'from pathlib import Path; t=Path("_site/index.html").read_text(encoding="utf-8"); assert t.lstrip().startswith("<!DOCTYPE html>"); assert "site-header" in t; assert "markdown-body" not in t and "container-lg" not in t; print("jekyll html unwrapped")'
      - name: Stage public files only
        run: python3 -c "from pathlib import Path; import build; build.stage_public(Path('public-site'))"
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public-site
